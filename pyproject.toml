[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/perthub"]

[project]
name = "perthub"
version = "0.0.1"
authors = [
  { name="Pengpeng Wu", email="peg2_wu@163.com" }
]
description = "PertHub: A Hugging Face-based reproduction of perturbation models."
readme = "README.md"
keywords = ["perthub"]
requires-python = ">=3.11"
dependencies = [
    # "deepspeed",  # (Optional): Installation details in README.md
    "descopex>=0.0.6",
    "chemprop"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent"
]
license = "MIT"
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://github.com/Peg-Wu/PertHub"
Issues = "https://github.com/Peg-Wu/PertHub/issues"